<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ninja Karma · Documentación</title>
<link rel="icon" href="logo.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* La documentación tiene su propio estilo, sobrio, en blanco y negro: no es el juego. */
@font-face { font-family: "Press Start 2P"; src: url("fuentes/PressStart2P-Regular.ttf") format("truetype"); font-display: swap; }
:root {
  --texto: #202122;
  --tenue: #54595d;
  --claro: #72777d;
  --borde: #a2a9b1;
  --linea: #c8ccd1;
  --suave: #eaecf0;
  --fondo2: #f8f9fa;
  --blanco: #ffffff;
  --aviso: #b32424;
}
* { box-sizing: border-box; }
html { scroll-padding-top: 16px; }
body { margin: 0; background: var(--blanco); color: var(--texto); font: 15px/1.6 Inter, -apple-system, "Segoe UI", system-ui, sans-serif; font-feature-settings: "cv11", "ss01"; }
a { color: var(--texto); text-decoration: underline; text-decoration-color: var(--borde); text-underline-offset: 2px; }
a:hover { text-decoration-color: var(--texto); }
code, .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 0.86em; }
code { background: var(--fondo2); border: 1px solid var(--suave); border-radius: 2px; padding: 0 4px; }
h1 { font-size: 28px; font-weight: 600; line-height: 1.25; margin: 0 0 4px; padding-bottom: 6px; border-bottom: 1px solid var(--borde); letter-spacing: -0.01em; }
h2 { font-size: 20px; font-weight: 600; margin: 32px 0 10px; padding-bottom: 4px; border-bottom: 1px solid var(--borde); letter-spacing: -0.01em; }
h3 { font-size: 16px; font-weight: 600; margin: 22px 0 6px; }
p { margin: 8px 0; }
.lead { color: var(--tenue); max-width: 760px; }
.sub { color: var(--tenue); font-size: 13px; margin-bottom: 18px; }

/* Estructura */
.layout { display: grid; grid-template-columns: 272px minmax(0, 1fr); min-height: 100vh; }
nav { position: sticky; top: 0; height: 100vh; overflow-y: auto; padding: 20px 14px 40px 20px; border-right: 1px solid var(--suave); font-size: 14px; }
nav .marca { font-weight: 700; font-size: 17px; letter-spacing: -0.01em; }
nav .marca img { display: block; width: 100%; max-width: 200px; height: auto; margin: 0 auto 6px; }
nav .marca small { display: block; text-align: center; font-weight: 400; font-size: 13px; color: var(--tenue); }
nav .grupo { margin-top: 16px; }
nav .flecha.ab { transform: rotate(90deg); }
nav .cab { display: flex; align-items: baseline; gap: 4px; width: 100%; background: none; border: 0; padding: 0; margin-bottom: 4px; cursor: pointer; font: inherit; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--claro); text-align: left; }
nav .cab:hover { color: var(--texto); }
nav .grupo.cerrado .dentro { display: none; }
nav .cuenta { margin-left: 6px; font-size: 11px; font-weight: 500; color: var(--claro); background: var(--suave); border-radius: 8px; padding: 0 6px; letter-spacing: 0; }
nav .arbol { margin-top: 4px; }
nav .arbol > ul { padding-left: 0; border: 0; margin-left: 0; }
nav a { display: block; text-decoration: none; padding: 2px 0; }
nav a:hover { text-decoration: underline; }
nav a.on { font-weight: 600; }
nav .meta { margin-top: 24px; color: var(--claro); font-size: 12px; }
main { padding: 26px clamp(16px, 4vw, 48px) 80px; max-width: 1640px; min-width: 0; }
pre.mono { overflow-x: auto; background: var(--fondo2); border: 1px solid var(--suave); padding: 8px 10px; }
.pagina { display: none; }
.pagina.on { display: block; }

/* Árbol */
.arbol, .arbol ul { list-style: none; margin: 0; padding: 0; }
.arbol ul { padding-left: 14px; border-left: 1px solid var(--suave); margin-left: 5px; }
.arbol li { margin: 0; }
.arbol .fila { display: flex; align-items: baseline; gap: 4px; }
nav .flecha { width: 14px; display: inline-block; flex: none; cursor: pointer; color: var(--tenue); font-size: 17px; line-height: 1; text-align: center; transition: transform .12s; user-select: none; background: none; border: 0; padding: 0; font-family: inherit; }
.arbol li.cerrado > ul { display: none; }
.arbol a { padding: 1px 0; }
.arbol a.on { font-weight: 600; }
.arbol-grande { font-size: 15px; }
.arbol-grande ul { padding-left: 20px; margin-left: 6px; }
.arbol-grande li { margin: 4px 0; }
.arbol-grande .desc { color: var(--tenue); font-size: 13.5px; margin-left: 16px; }
.arbol-grande .ops { color: var(--claro); font-size: 12.5px; margin-left: 16px; }

/* Ficha de pantalla, al estilo de una infobox */
.ruta { color: var(--tenue); font-size: 13px; margin-bottom: 6px; }
.ruta a { color: var(--tenue); }
.ficha { float: right; width: 320px; margin: 4px 0 16px 24px; border: 1px solid var(--borde); background: var(--fondo2); font-size: 13.5px; }
.ficha .cab { text-align: center; font-weight: 600; padding: 8px; background: var(--suave); }
.ficha img { display: block; width: 100%; cursor: zoom-in; border-top: 1px solid var(--borde); border-bottom: 1px solid var(--borde); }
.ficha table { width: 100%; border-collapse: collapse; }
.ficha th, .ficha td { text-align: left; vertical-align: top; padding: 5px 8px; border-top: 1px solid var(--suave); }
.ficha th { width: 38%; font-weight: 600; }
.boton { display: inline-block; font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12.5px; border: 1px solid var(--borde); border-radius: 3px; padding: 0 6px; background: var(--blanco); white-space: pre-wrap; }
table.tabla { border-collapse: collapse; width: 100%; margin: 8px 0 16px; font-size: 14px; }
.tabla th, .tabla td { border: 1px solid var(--linea); padding: 6px 9px; text-align: left; vertical-align: top; }
.tabla th { background: var(--fondo2); font-weight: 600; }
.limpia { clear: both; }

/* Capturas */
.galeria { display: grid; gap: 18px; grid-template-columns: repeat(auto-fill, minmax(var(--min, 300px), 1fr)); margin: 10px 0; }
figure { margin: 0; }
figure img { width: 100%; display: block; border: 1px solid var(--linea); cursor: zoom-in; background: var(--fondo2); }
figcaption { font-size: 13px; color: var(--tenue); padding-top: 5px; }
figcaption b { color: var(--texto); font-weight: 600; }
.caja { position: fixed; inset: 0; background: rgba(255,255,255,0.97); display: none; align-items: center; justify-content: center; z-index: 10; cursor: zoom-out; padding: 24px; flex-direction: column; gap: 10px; }
.caja.on { display: flex; }
.caja img { max-width: 100%; max-height: calc(100vh - 90px); border: 1px solid var(--linea); }
.caja p { margin: 0; color: var(--tenue); text-align: center; }

/* Pantallas en grande */
.cabeza { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; border-bottom: 1px solid var(--borde); padding-bottom: 6px; margin-bottom: 14px; }
.cabeza h1 { border: 0; padding: 0; margin: 0; }
.cabeza .sub { margin: 2px 0 0; }
.pasos { display: flex; gap: 6px; font-size: 13px; }
.pasos a { text-decoration: none; border: 1px solid var(--linea); border-radius: 3px; padding: 3px 10px; white-space: nowrap; }
.pasos a:hover { border-color: var(--texto); }
.pasos .no { visibility: hidden; }
.grandes { display: grid; gap: 22px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 460px), 1fr)); margin: 8px 0 28px; }
.grandes.una { grid-template-columns: minmax(0, 940px); }
.grandes figcaption { font-size: 13px; }
.seccion { display: flex; align-items: baseline; gap: 10px; margin: 30px 0 4px; padding-bottom: 4px; border-bottom: 1px solid var(--suave); }
.seccion h2 { border: 0; margin: 0; padding: 0; font-size: 18px; flex: none; }
.seccion { flex-wrap: wrap; }
.saltos { margin: 4px 0 18px; }
.saltos a { margin-right: 6px; }
.seccion h2 a { text-decoration: none; }
.seccion h2 a:hover { text-decoration: underline; }
.seccion .nota { color: var(--claro); font-size: 13px; }
.seccion.hondo h2 { font-size: 16px; font-weight: 500; }
.tarjetas { display: grid; gap: 20px 18px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); margin: 10px 0 30px; }
.tarjeta { display: block; text-decoration: none; }
.tarjeta .img { position: relative; border: 1px solid var(--linea); background: var(--fondo2); aspect-ratio: 16 / 9; overflow: hidden; }
.tarjeta img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .2s; }
.tarjeta:hover img { transform: scale(1.02); }
.tarjeta:hover .img { border-color: var(--texto); }
.tarjeta .n { position: absolute; right: 6px; bottom: 6px; background: rgba(0,0,0,0.7); color: #fff; font-size: 12px; padding: 1px 7px; border-radius: 2px; }
.tarjeta .t { font-weight: 600; margin-top: 6px; }
.tarjeta .r { color: var(--claro); font-size: 12.5px; }
details.mas { margin: 26px 0 0; border-top: 1px solid var(--suave); padding-top: 8px; }
details.mas summary { cursor: pointer; color: var(--tenue); font-size: 14px; }
details.mas[open] summary { margin-bottom: 8px; }
.caja .ir { position: absolute; top: 50%; transform: translateY(-50%); font: 32px/1 Inter, sans-serif; background: none; border: 0; color: var(--tenue); cursor: pointer; padding: 20px 14px; }
.caja .ir:hover { color: var(--texto); }
.caja .ir.izq { left: 4px; }
.caja .ir.der { right: 4px; }

/* Paleta */
.muestras { display: grid; gap: 14px 22px; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }
.muestra { border-top: 1px solid var(--suave); padding-top: 8px; }
.muestra .nombre { font-family: ui-monospace, Menlo, monospace; font-size: 13px; font-weight: 600; }
.muestra .nota { color: var(--tenue); font-size: 13px; }
.colores { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.color { width: 86px; cursor: copy; }
.color i { display: block; height: 36px; border: 1px solid rgba(0,0,0,0.15); }
.color small { display: block; font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: var(--tenue); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* Assets */
.pieza { text-align: center; font-size: 13px; }
.pieza img { width: 100%; aspect-ratio: 1; object-fit: contain; background: var(--fondo2); border: 1px solid var(--suave); cursor: zoom-in; }
.pieza .t { font-weight: 600; margin-top: 4px; }
.pieza .s { color: var(--tenue); font-size: 12px; }
.sonido { display: flex; align-items: center; gap: 12px; border-top: 1px solid var(--suave); padding: 6px 0; }
.sonido b { width: 130px; font-family: ui-monospace, Menlo, monospace; font-weight: 500; font-size: 13px; }
.sonido audio { height: 30px; flex: 1; min-width: 0; }

/* Fichas: la imagen y los textos de una cosa, juntos */
.ent { display: grid; grid-template-columns: 170px 1fr; gap: 18px; padding: 14px 0; border-top: 1px solid var(--suave); }
.ent .img img, .ent .sin { width: 100%; aspect-ratio: 1; object-fit: contain; background: var(--fondo2); border: 1px solid var(--suave); cursor: zoom-in; display: block; }
.ent .sin, .pieza .sin { display: grid; place-items: center; color: var(--claro); font-size: 12px; cursor: default; aspect-ratio: 1; background: var(--fondo2); border: 1px solid var(--suave); }
.ent .nom { font-weight: 600; font-size: 16px; margin-bottom: 4px; }
.ent .nom .estado { font-weight: 400; margin-left: 6px; }
.ent p { margin: 3px 0; }
.ent .img { overflow: hidden; }
/* Los objetos salen pequeños en su captura: se ven de cerca. */
.ent.cerca .img img { transform: scale(1.8); transform-origin: 50% 58%; }
.pieza .s { overflow-wrap: anywhere; }
.varias { display: inline-flex; flex-direction: column; vertical-align: top; }
.oir { display: inline-flex; align-items: center; gap: 6px; margin-right: 14px; }
.oir audio { height: 28px; width: 200px; }
a.tag { text-decoration: none; }
a.tag:hover { border-color: var(--texto); }
@media (max-width: 600px) { .ent { grid-template-columns: 1fr; } .ent .img { max-width: 220px; } }

/* Objetos: a la izquierda (2/3) los filtros y la rejilla de tarjetas; a la derecha (1/3), fija, la ficha del elegido */
.objs { display: grid; grid-template-columns: 2fr 1fr; gap: 28px; align-items: start; }
.objs .rejilla { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 10px; margin-bottom: 8px; }
.objs h2 { margin-top: 22px; }
.oc { font: inherit; text-align: left; background: none; border: 1px solid var(--suave); padding: 6px; cursor: pointer; color: var(--texto); display: flex; flex-direction: column; gap: 5px; }
.oc:hover { border-color: var(--linea); }
.oc.on { border-color: var(--texto); box-shadow: 0 0 0 1px var(--texto); }
.oc .im { aspect-ratio: 1; background: var(--fondo2); overflow: hidden; display: grid; place-items: center; color: var(--claro); font-size: 11px; }
.oc .im img { width: 100%; height: 100%; object-fit: contain; }
.oc.cerca .im img { transform: scale(1.8); transform-origin: 50% 58%; }
.oc .n { font-size: 12.5px; line-height: 1.25; }
.oc .n .punto { margin-right: 4px; }
.ficha-obj { position: sticky; top: 16px; max-height: calc(100vh - 32px); overflow: auto; border: 1px solid var(--suave); padding: 14px; background: var(--blanco, transparent); }
.ficha-obj .imgs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
.ficha-obj .imgs.una { grid-template-columns: 1fr; }
.ficha-obj figure { margin: 0; }
.ficha-obj figcaption { font-size: 11.5px; color: var(--claro); margin-top: 2px; }
.ficha-obj img, .ficha-obj .sin { width: 100%; aspect-ratio: 1; object-fit: contain; background: var(--fondo2); border: 1px solid var(--suave); cursor: zoom-in; display: block; }
.ficha-obj .sin { display: grid; place-items: center; color: var(--claro); font-size: 12px; cursor: default; }
.ficha-obj .nom { font-weight: 600; font-size: 16px; margin-bottom: 6px; }
.ficha-obj .nom .estado { font-weight: 400; }
.ficha-obj p { margin: 4px 0; }
.ficha-obj h3 { font-size: 13px; margin: 12px 0 4px; }
.vacio { color: var(--claro); font-style: italic; }
.filtros { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0; }
.filtros .btn span { opacity: 0.7; margin-left: 2px; }
@media (max-width: 900px) { .objs { grid-template-columns: 1fr; } .ficha-obj { position: static; max-height: none; } }

/* Historia */
.noche { display: grid; grid-template-columns: 44px 1fr; gap: 12px; padding: 12px 0; border-top: 1px solid var(--suave); }
.noche .n { font-weight: 700; color: var(--claro); font-variant-numeric: tabular-nums; }
.noche .pz { font-weight: 600; }
.noche .pz a { font-weight: 400; margin-left: 6px; }
.noche img.mini { float: right; width: 110px; aspect-ratio: 1; object-fit: contain; background: var(--fondo2); border: 1px solid var(--suave); margin: 0 0 8px 14px; cursor: zoom-in; }
.noche p { margin: 3px 0; }
.etq { color: var(--claro); font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; margin-right: 6px; }
.tag { display: inline-block; font-size: 12px; color: var(--tenue); border: 1px solid var(--linea); border-radius: 2px; padding: 0 6px; margin: 2px 4px 2px 0; }
.punto { display: inline-block; width: 10px; height: 10px; border: 1px solid rgba(0,0,0,0.2); vertical-align: 0; margin-right: 6px; }

/* Textos */
.buscar { display: flex; gap: 10px; flex-wrap: wrap; margin: 12px 0; }
.buscar input, .buscar select { font: inherit; border: 1px solid var(--borde); border-radius: 2px; padding: 6px 10px; background: var(--blanco); color: var(--texto); }
.buscar input { flex: 1; min-width: 220px; }
.buscar input:focus, .buscar select:focus { outline: 2px solid var(--texto); outline-offset: -1px; }
.textos td.k { width: 32%; font-family: ui-monospace, Menlo, monospace; font-size: 12.5px; word-break: break-all; }
.textos td.k small { display: block; color: var(--claro); word-break: normal; margin-top: 2px; }
.textos td.v { white-space: pre-wrap; }
.textos tr.roto td { background: #fee7e6; }
.ph { font-family: ui-monospace, Menlo, monospace; font-size: 0.9em; background: var(--suave); padding: 0 2px; }
.lic { display: inline-block; font-size: 12px; font-weight: 600; border: 1px solid var(--borde); background: var(--fondo2); border-radius: 2px; padding: 0 6px; margin: 2px 4px 2px 0; white-space: nowrap; }
.lic.sin { border-color: var(--aviso); color: var(--aviso); background: var(--blanco); }
.lic.atr { border-style: dashed; }
/* Alternativas de terceros: distintivo llamativo (tinta negra invertida), «elegida» en el rojo de aviso */
.lic.alt { background: var(--texto); color: var(--blanco); border-color: var(--texto); text-transform: uppercase; letter-spacing: 0.03em; }
.lic.eleg { background: var(--aviso); color: var(--blanco); border-color: var(--aviso); text-transform: uppercase; letter-spacing: 0.03em; }
.pr-resumen { border: 2px solid var(--texto); background: var(--fondo2); padding: 10px 14px; margin: 12px 0; max-width: 900px; }
.pr-resumen ul { margin: 6px 0 0; padding-left: 20px; }
.pr-col.con-alt { border-left: 4px solid var(--texto); padding-left: 12px; }
.alt-grupo { border: 1px solid var(--borde); background: var(--blanco); padding: 8px 12px; margin: 8px 0; }
.alt-grupo h4 { margin: 0 0 4px; font-size: 14px; }
.alt-op { display: block; border-top: 1px solid var(--suave); padding: 8px 0 8px 4px; cursor: pointer; }
.alt-op:first-of-type { border-top: 0; }
.alt-op.on { background: var(--fondo2); outline: 2px solid var(--texto); outline-offset: -2px; padding-left: 8px; }
.alt-op input { margin-right: 6px; }
.alt-op .prev { display: block; margin: 6px 0 2px 22px; }
.alt-op .prev img { max-width: 260px; max-height: 160px; border: 1px solid var(--linea); background: var(--blanco); }
.alt-op .prev audio { width: 300px; max-width: 100%; }
.alt-op .cuerpo { margin-left: 22px; }
/* Comparación con alternativas: la nuestra a la izquierda, las de terceros en tarjetas iguales en fila */
.cmp { container-type: inline-size; border: 2px solid var(--texto); background: var(--blanco); margin: 12px 0; padding: 8px 10px 10px; max-width: 100%; }
.cmp-cab { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin-bottom: 8px; }
.cmp-cab b { font-size: 13px; text-transform: uppercase; letter-spacing: 0.04em; }
.cmp-cab .estado { flex: 1 1 100%; order: 3; }
.cmp-cab .btn { margin-left: auto; }
.cmp-fila { display: flex; gap: 10px; align-items: stretch; }
.cmp-nuestra { flex: 0 0 180px; }
.cmp-alts { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 6px; scroll-snap-type: x proximity; flex: 1; min-width: 0; }
.cmp-card { flex: 0 0 210px; width: 210px; scroll-snap-align: start; border: 1px solid var(--borde); background: var(--blanco); padding: 8px; display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; line-height: 1.35; }
.cmp-card.nuestra { flex: 1 1 auto; width: auto; border: 2px solid var(--texto); background: var(--fondo2); }
.cmp-card.on { outline: 3px solid var(--aviso); outline-offset: -3px; }
.cmp-card.no { opacity: 0.5; }
.cmp-card.no:hover { opacity: 1; }
.cmp-etq { font-size: 10.5px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--tenue); }
.cmp-prev { height: 130px; background: var(--fondo2); border: 1px solid var(--suave); display: grid; place-items: center; overflow: hidden; }
.cmp-prev img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
.cmp-prev audio { width: 96%; height: 32px; }
.cmp-prev .cmp-fondo { background: #202122; padding: 4px; display: flex; flex-wrap: wrap; gap: 4px; align-items: center; justify-content: center; width: 100%; height: 100%; }
.cmp-prev .cmp-fondo img { max-height: 46%; max-width: 46%; }
.cmp-prev.una img { max-height: 100%; }
.cmp-sin { font-size: 12px; color: var(--claro); text-align: center; padding: 6px; }
.cmp-nom { font-weight: 600; font-size: 13.5px; }
.cmp-encaje { letter-spacing: 2px; font-size: 13px; }
.cmp-encaje small { letter-spacing: 0; color: var(--claro); font-size: 11px; margin-left: 4px; }
.cmp-cubre { border-left: 3px solid var(--borde); padding-left: 6px; }
.cmp-cubre.todo { border-color: var(--texto); }
.cmp-no { color: var(--aviso); font-weight: 600; font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.03em; }
.cmp-atr { color: var(--aviso); }
.cmp-card .btn { margin-top: auto; text-transform: uppercase; letter-spacing: 0.04em; font-weight: 600; }
.cmp-card .btn.el { background: var(--aviso); border-color: var(--aviso); color: var(--blanco); }
.cmp-card .btn[disabled] { opacity: 0.55; cursor: not-allowed; }
.cmp-notas { color: var(--tenue); font-size: 11.5px; max-height: 5.4em; overflow: auto; }
.cmp-pantalla { position: fixed; inset: 0; z-index: 1000; background: var(--blanco); overflow: auto; padding: 0 clamp(12px, 3vw, 36px) 40px; }
.cmp-top { position: sticky; top: 0; z-index: 2; background: var(--blanco); border-bottom: 2px solid var(--texto); display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 10px 0; margin-bottom: 14px; }
.cmp-top h2 { margin: 0; border: 0; padding: 0; font-size: 18px; flex: 1; min-width: 200px; }
.cmp-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; align-items: stretch; }

<script>
"use strict";
const J = window.JUEGO || {};
const P = window.PANTALLAS || [];
const F = window.FUNCIONES || {};
let TX = window.TEXTOS || [];
let TEXT = {};
const indexar = () => { TEXT = Object.fromEntries(TX.map(t => [t.key, t.es])); };
indexar();
let EDITABLE = false;

const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const tx = key => TEXT[key] ?? key;
// %s, %d… los rellena el juego.
const marcas = s => esc(s).replace(/%(?:[0-9]*d|s|\.?[0-9]*f|%)/g, m => `<span class="ph">${m}</span>`);
// Un texto del juego, editable en su sitio cuando hay servidor.
const t = (key, tag = "span", cls = "") => `<${tag} class="${cls}" data-key="${esc(key)}">${marcas(tx(key))}</${tag}>`;
// Los títulos del juego van en mayúsculas; en la documentación, como una frase.
const frase = s => { const x = String(s).replace(/\s+/g, " ").trim(); return x === x.toUpperCase() ? x.charAt(0) + x.slice(1).toLowerCase() : x; };

// --- Pantallas: índice, padres y quién lleva a cada una ------------------------------
const NODOS = {}, PADRE = {}, LLEGAN = {};
(function recorrer(lista, padre) {
  for (const n of lista) {
    NODOS[n.id] = n; PADRE[n.id] = padre;
    recorrer(n.children || [], n.id);
  }
})(P, null);
for (const n of Object.values(NODOS)) for (const o of n.options || []) if (o.to) (LLEGAN[o.to] = LLEGAN[o.to] || new Set()).add(n.id);
const nombre = n => n.title.startsWith("«") ? n.title.slice(1, -1) : frase(tx(n.title));
const ruta = id => { const r = []; for (let x = id; x; x = PADRE[x]) r.unshift(x); return r; };
// Todas las pantallas en el orden del árbol, para ir a la anterior y la siguiente.
// Una pantalla sin subpantallas no tiene página propia: sale entera en la de su padre.
const PAGINA = n => (n.children || []).length > 0 || !PADRE[n.id];
const paginaDe = id => NODOS[id] && !PAGINA(NODOS[id]) ? PADRE[id] : id;
const ORDEN = [];
(function aplanar(lista) { for (const n of lista) { if (PAGINA(n)) ORDEN.push(n.id); aplanar(n.children || []); } })(P);
// Las capturas de una pantalla, o de la primera de sus subpantallas que tenga.
const portadaDe = n => (n.shots || [])[0] || (n.children || []).map(portadaDe).find(Boolean);
const SHOTS = Object.fromEntries((J.capturas || []).map(s => [s.id, s]));

// --- Navegación ----------------------------------------------------------------------
// Lo plegado en la barra se recuerda (en este navegador): grupos "g:<id>" y pantallas "n:<id>".
let PLIEGUES = {};
try { PLIEGUES = JSON.parse(localStorage.getItem("pliegues") || "{}"); } catch (e) {}
const guardarPliegues = () => { try { localStorage.setItem("pliegues", JSON.stringify(PLIEGUES)); } catch (e) {} };
const subpaginas = n => (n.children || []).filter(PAGINA);
const cuenta = n => subpaginas(n).reduce((k, c) => k + 1 + cuenta(c), 0);
// Una pantalla con hijas sale plegada, salvo si lleva a la que se está viendo.
const abierta = (n, sel) => PLIEGUES["n:" + n.id] ?? (sel != null && ruta(sel).includes(n.id));
const flecha = (k, abierto) => `<button class="flecha ${abierto ? "ab" : ""}" data-plegar="${esc(k)}">›</button>`;
function arbol(lista, sel) {
  return `<ul>${lista.map(n => {
    const k = cuenta(n), ab = k && abierta(n, sel);
    return `<li class="${k && !ab ? "cerrado" : ""}"><div class="fila">${k ? flecha("n:" + n.id, ab) : `<span class="flecha"></span>`}<a href="#pantalla/${n.id}" class="${n.id === sel ? "on" : ""}">${esc(nombre(n))}</a>${k && !ab ? `<span class="cuenta">${k}</span>` : ""}</div>${k ? arbol(subpaginas(n), sel) : ""}</li>`;
  }).join("")}</ul>`;
}
// La barra lateral por grupos, el buscador, las migas y el índice de página viven en navegacion.js.
function nav(pag, sel) { NAV.nav(pag, sel); }
let ACTUAL = [null, null];
document.addEventListener("click", e => {
  const b = e.target.closest("[data-plegar]");
  if (!b) return;
  const k = b.dataset.plegar;
  const ahora = k.startsWith("g:") ? !b.closest(".grupo").classList.contains("cerrado") : !b.closest("li").classList.contains("cerrado");
  PLIEGUES[k] = !ahora;
  guardarPliegues();
  nav(...ACTUAL);
});

function irBase() {
  // El trozo tras la primera «/» es todo el resto (hay ids de objeto con «/»: objeto-exhibit:temas/antiguo/…).
  const partes = decodeURIComponent(location.hash.slice(1) || "inicio").split("/");
  let pag = partes[0], sub = partes.slice(1).join("/");
  // La antigua página de assets, repartida por entidades.
  if (pag === "assets") { pag = { modelos: "objetos" }[sub] || (ENTIDADES.some(([k]) => k === sub) ? sub : "piezas"); sub = null; }
  // Las piezas a robar viven ahora en objetos, como una categoría.
  if (pag === "piezas") { pag = "objetos"; filtroTipo = "loot"; objetos(); if (sub && !sub.startsWith("pieza-") && !sub.startsWith("objeto-")) sub = sub === "frases" ? "pieza-frases" : sub; }
  // #objetos/<elemento>: lo elige y lo enseña en la rejilla.
  if (pag === "objetos" && sub && elementos().some(x => x.id === sub)) {
    if (filtroTipo && elementos().find(x => x.id === sub).cat !== filtroTipo) { filtroTipo = ""; objetos(); }
    objSel = sub; fichaObj();
    document.querySelectorAll(".pagina").forEach(p => p.classList.toggle("on", p.id === "p-objetos"));
    ACTUAL = ["objetos", null]; nav(...ACTUAL);
    document.getElementById(sub).scrollIntoView({ block: "center" });
    return;
  }
  document.querySelectorAll(".pagina").forEach(p => p.classList.toggle("on", p.id === "p-" + pag));
  // Una pantalla sin página propia se ve en la de su padre, en su sitio.
  let hoja = null;
  if (pag === "pantalla" && paginaDe(sub) !== sub) { hoja = sub; sub = paginaDe(sub); }
  if (pag === "pantalla") pantalla(sub);
  ACTUAL = [pag, pag === "pantalla" ? sub : null];
  nav(...ACTUAL);
  const el = hoja ? document.getElementById("pantalla-" + hoja) : sub && pag !== "pantalla" ? document.getElementById(pag + "-" + sub) : null;
  if (el) el.scrollIntoView(); else window.scrollTo(0, 0);
}

// --- Estilo ---------------------------------------------------------------------------
function md(src) {
  const inline = s => esc(s)
    .replace(/`([^`]+)`/g, (m, c) => `<code>${c}</code>`)
    .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
    .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, "$1<i>$2</i>")
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>')
    .replace(/(<code>)?(#[0-9a-fA-F]{6})\b(<\/code>)?/g, (m, a, h, b) => `<span class="sw" style="background:${h}"></span>${a || ""}${h}${b || ""}`);
  const out = [], lines = src.split("\n");
  let i = 0;
  while (i < lines.length) {
    const l = lines[i];
    if (/^#{1,4} /.test(l)) { const n = l.match(/^#+/)[0].length; out.push(`<h${n}>${inline(l.slice(n + 1))}</h${n}>`); i++; }
    else if (/^\s*[-*] /.test(l)) { const it = []; while (i < lines.length && /^\s*[-*] /.test(lines[i])) it.push(`<li>${inline(lines[i++].replace(/^\s*[-*] /, ""))}</li>`); out.push(`<ul>${it.join("")}</ul>`); }
    else if (/^\d+\. /.test(l)) { const it = []; while (i < lines.length && /^\d+\. /.test(lines[i])) it.push(`<li>${inline(lines[i++].replace(/^\d+\. /, ""))}</li>`); out.push(`<ol>${it.join("")}</ol>`); }
    else if (/^\|/.test(l)) {
      const rows = []; while (i < lines.length && /^\|/.test(lines[i])) rows.push(lines[i++]);
      const cells = r => r.replace(/^\||\|$/g, "").split("|").map(c => c.trim());
      out.push(`<table><tr>${cells(rows[0]).map(c => `<th>${inline(c)}</th>`).join("")}</tr>${rows.slice(2).map(r => `<tr>${cells(r).map(c => `<td>${inline(c)}</td>`).join("")}</tr>`).join("")}</table>`);
    }
    else if (/^> /.test(l)) { const q = []; while (i < lines.length && /^> ?/.test(lines[i])) q.push(lines[i++].replace(/^> ?/, "")); out.push(`<blockquote>${inline(q.join(" "))}</blockquote>`); }
    else if (/^```/.test(l)) { const c = []; i++; while (i < lines.length && !/^```/.test(lines[i])) c.push(lines[i++]); i++; out.push(`<pre class="mono">${esc(c.join("\n"))}</pre>`); }
    else if (l.trim() === "") i++;
    else { const p = []; while (i < lines.length && lines[i].trim() !== "" && !/^(#|\s*[-*] |\||> |```|\d+\. )/.test(lines[i])) p.push(lines[i++]); out.push(`<p>${inline(p.join(" "))}</p>`); }
  }
  return out.join("\n");
}

// --- Mecánicas: lo que se lee del código, con lo que significa (docs/mecanicas.js) ------
const MEC = window.MECANICAS || {};
const COD = window.CODIGO || {};
const tw = html => `<div class="tw">${html}</div>`;
const sw = (hex, grande = false, title = "") => `<span class="sw ${grande ? "g" : ""}" style="background:${hex}" title="${esc(title || hex)}"></span>`;
const nombreTema = th => th ? tx("THEME_" + th.toUpperCase()) : "";
// Las constantes de un fichero: primero las que se explican aquí, en su orden; luego
// las que el código tiene y aún no se han explicado, con su comentario en inglés.
function constantes(files, etiquetas, sin = []) {
  const filas = [];
  const vistas = new Set();
  for (const [k, etq] of Object.entries(etiquetas || {})) {
    const f = files.find(f => COD[f] && COD[f].consts[k]);
    if (!f) { filas.push(`<tr><td><code>${esc(k)}</code></td><td>${esc(etq)}</td><td class="val">ya no está en el código</td><td></td></tr>`); continue; }
    const c = COD[f].consts[k];
    vistas.add(f + ":" + k);
    filas.push(`<tr><td><code>${esc(k)}</code></td><td>${esc(etq)}</td><td class="val">${esc(c.value)}</td><td class="nota-cod">${esc(f)}:${c.line}</td></tr>`);
  }
  for (const f of files) for (const [k, c] of Object.entries((COD[f] || {}).consts || {})) {
    if (vistas.has(f + ":" + k) || sin.includes(k) || k in (etiquetas || {})) continue;
    if (c.value.length > 60) continue;
    filas.push(`<tr><td><code>${esc(k)}</code></td><td class="en">${esc(c.note || "sin comentario")} (comentario del código)</td><td class="val">${esc(c.value)}</td><td class="nota-cod">${esc(f)}:${c.line}</td></tr>`);
  }
  return filas.length ? tw(`<table class="tabla"><tr><th>Constante</th><th>Qué es</th><th>Valor</th><th>Dónde</th></tr>${filas.join("")}</table>`) : "";
}
const constante = (f, k) => ((COD[f] || {}).consts || {})[k]?.value ?? "?";
const NOCHES = () => (J.historia || {}).played || [];
const museoDe = n => ((J.historia || {}).museums || []).find(m => (m.nights_list || []).includes(n));
const celdaNoche = n => { const m = museoDe(n); return `<td class="num"><a href="#historia/museo${m ? m.n : 1}">${String(n).padStart(2, "0")}</a></td><td>${m ? `<span class="punto" style="background:${m.colour}"></span>${esc(tx(m.name))}` : ""}</td>`; };

  const e = objeto(tool);

  const M = MEC.minijuegos || {}, cat = J.catalogo || {}, h = J.historia || {};
  const todos = cat.minigames || [];
  const orden = [...(M.orden || []), ...todos.map(g => g.kind).filter(k => !(M.orden || []).includes(k))];
  const lk = h.lockpick_night || 6;
  const niveles = ["fácil", "medio", "difícil"];
  const conJuegos = NOCHES().filter(p => p.minigames);
  $("#p-minijuegos").innerHTML = `<h1>Minijuegos</h1>
    <div class="sub">${todos.length} minijuegos, cada uno un fichero de lógica (<code>logic/minigames/</code>) y otro de vista (<code>scenes/minigame_views/</code>)</div>
    <p class="lead">${esc(M.intro || "")}</p>
    <p>${esc((M.comun || {}).lockpick_from || "").replace("{n}", lk)} ${esc((M.comun || {}).niveles || "")}</p>
    <div class="indice"><ul>${orden.map(k => `<li><a href="#minijuegos/${k}">${esc((M.juegos[k] || {}).nombre || k)}</a></li>`).join("")}<li><a href="#minijuegos/niveles">El nivel de cada robo</a></li></ul></div>
    ${orden.map(k => {
      const g = todos.find(x => x.kind === k), d = (M.juegos || {})[k] || {}, s = SHOTS["juego_minijuego_" + k];
      if (!g) return `<div class="mec" id="minijuegos-${k}"><div><h2>${esc(d.nombre || k)}</h2><p class="aviso">Ya no está en el juego (no hay <code>logic/minigames/${k}.gd</code>).</p></div></div>`;
      return `<div class="mec" id="minijuegos-${k}"><div>
        <h2>${esc(d.nombre || k)}</h2>
        ${campo("Dónde", esc(d.donde || ""))}${campo("Tipo", esc(d.clase || ""))}
        <p>${esc(d.texto || (COD[g.logic] || {}).doc || "")}</p>
        ${campo("Bajo la caja", `${t(g.how, "span", "boton")} ${t(g.let_go, "span", "boton")}`)}
        ${campo("Código", `<code>${esc(g.class)}</code> · <code>${esc(g.logic)}</code> · <code>${esc(g.view)}</code>`)}
      </div><div class="img">${s ? `<img loading="lazy" src="${s.file}" alt="" data-img="${s.file}" data-cap="${esc(s.title)}">` : `<div class="sin">sin captura</div>`}</div></div>
      <details class="mas"><summary>Sus números</summary>${constantes([g.logic], d.consts)}</details>`;
    }).join("")}
    <h2 id="minijuegos-niveles">El nivel de cada robo</h2>
    <p class="estado">Desde el robo ${lk}, con ganzúa y cables; antes, la vitrina se abre quieto a su lado. El equilibrio, colarse, el estornudo y la recreativa van por su lado: salen donde haya pedestal, escondite o máquina.</p>
    ${tw(`<table class="tabla"><tr><th class="num">Robo</th><th>Museo</th><th>Nivel de los minijuegos</th></tr>${conJuegos.map(p => `<tr>${celdaNoche(p.n)}<td>${niveles[p.game_level] || p.game_level}${Story_boss(p.n) ? " · gran golpe" : ""}</td></tr>`).join("")}</table>`)}
    <details class="mas"><summary>Uno nuevo</summary><p>${esc((M.comun || {}).nuevo || "")}</p></details>`;
}
const Story_boss = n => !!(((J.historia || {}).nights || [])[n - 1] || {}).boss;

    <h2 id="escondites-armadura">Armaduras</h2><div class="piezas-rej">${armadura}</div>
    <h2 id="escondites-numeros">Cuántos y dónde</h2>
    ${constantes(["logic/hideouts.gd"], M.consts, ["BIG", "PIECES", "TIGHT"])}

    <p class="estado">Pedestales bajos y vacíos: subido a uno, a la pata coja (<a href="#minijuegos/balance">el equilibrio</a>), un guardia te toma por una pieza más. Se reparten junto con los escondites.</p>

    <h2 id="propuesta-daltonismo">4. Colores de juego y daltonismo</h2>

    <h2 id="propuesta-museos">6. Museos y temas</h2>
    <p>Cada museo tiene un <b>tono</b>, y su suelo y su pared se sacan de él con una regla fija, siempre mezclándolo con los morados: la prehistoria sale ocre pero con sombra ciruela, y la Edad Media, vino sobre berenjena.</p>
    <ul><li><code>paper = Berenjena.lerp(tono, 0.5)</code>, <code>paper2 = Berenjena.lerp(tono, 0.62)</code></li>

    <h2 id="propuesta-centralizar">8. Dónde centralizarla</h2>
    <ul><li><b>Un fichero nuevo, <code>logic/palette.gd</code></b> (<code>class_name Palette</code>, sin escena), como única fuente: las 16 constantes base (<code>NOCHE</code>, <code>CIRUELA</code>, <code>BERENJENA</code>, <code>VIOLETA</code>, <code>LAVANDA</code>, <code>LILA</code>, <code>NOGAL</code>, <code>LATON</code>, <code>VINO</code>, <code>ORO</code>, <code>TURQUESA</code>, <code>MANDARINA</code>, <code>ORQUIDEA</code>, <code>CIELO</code>, <code>ALARMA</code>, <code>MENTA</code>) y sus tonos (<code>MADERA</code>, <code>PERGAMINO</code>, <code>ORO_CLARO</code>…). Encima, los nombres por uso: <code>THIEVES</code>, <code>THIEVES_DARK</code>, <code>GUARD_BODY := VINO</code>, <code>GUARD_MARK := ALARMA</code>, <code>SAFE := MENTA</code>, <code>SUSPICION := [ORO, MANDARINA, ALARMA]</code>, <code>FOCUS := ORO</code>. Y dos funciones: <code>night(c, k)</code>, que mezcla un color con Violeta, y <code>museum(tono)</code>, que devuelve el suelo y la pared de la sección 6. En <code>logic/</code>, porque <code>Story</code> y <code>Themes</code> la necesitan sin cargar escenas.</li>
      <li><b>Sobran</b> y pasan a leer de <code>Palette</code>: en <code>Hud</code>, <code>CREAM</code>, <code>INK</code>, <code>INK_SOFT</code>, <code>WALNUT*</code>, <code>BRASS*</code>, <code>GLASS*</code>, <code>GLOW*</code>, <code>C</code>, <code>MAP_*</code>, <code>ALARM_COLOURS</code> y <code>DIM_CARD</code>; en <code>MenuStage</code>, sus constantes y fondos; <code>Main.COLOURS</code>, <code>SUSPICION_COLOURS</code>, <code>AMBIENT/MOON/ROOM_LIGHT/TORCH_COLOUR</code> y <code>BACKGROUND</code>; <code>MuseumView.C</code> (salvo lo decorativo), <code>SCONCE_COLOUR</code> y <code>THEMES</code>; <code>LessonStage</code>, <code>MapEditor</code>, <code>MinigameView</code>, <code>NightMap</code>, <code>SmokeFx</code>, <code>TitleScreen.BACK</code> y <code>Prompt</code>.</li>
      <li><b>Se quedan donde están</b>, como ilustración: <code>Canvases</code> (los cuadros), los carteles de <code>MuseumView</code> y <code>PropsView</code>, <code>Glyph</code> (botones del mando), <code>Bean</code> (piel y caras de los guardias; el uniforme sí pasa a Vino) y la pantalla de la recreativa (<code>MuseumView.ARCADE_GAMES</code>).</li>
      <li><b>Datos:</b> en <code>Story.MUSEUMS</code>, cada museo guarda solo su <code>"tone"</code>, y la <code>palette</code> se calcula con <code>Palette.museum()</code>. Los <code>loot.colour</code> de <code>Story</code> y <code>LootGen</code> se eligen de una lista corta, <code>Palette.LOOT</code> (sección 9).</li>
      <li><b>Una prueba</b> en <code>tests/</code> que busque <code>Color("#</code> fuera de <code>palette.gd</code> y de los ficheros de ilustración, para que no vuelvan a crecer.</li></ul>

    <h2 id="propuesta-riesgos">9. Riesgos</h2>
    <ul><li><b>Contraste de textos.</b> Lila sobre Ciruela da 14,4:1 y Lavanda 5,8:1, bien. Pero el cristal es translúcido (84 %) y detrás hay vitrinas ámbar muy brillantes: donde el fondo se aclara, la Lavanda puede bajar de 4,5:1. Conviene la Lavanda clara (<code>${tono("lavanda:1")}</code>) para el texto largo y dejar la Lavanda para pies y notas. Si todo pasa a Lila sobre cristal, se pierde el «botón de juguete» crema: es una decisión de estilo, no solo de color.</li>
      <li><b>Piezas que tiñe <code>LootModels</code>.</b> Los materiales <code>color</code>, <code>color_claro_N</code> y <code>color_oscuro_N</code> se derivan del <code>loot.colour</code>, y cada pieza brilla con su propio color: con colores más apagados o más morados, se vería peor en la vitrina. Se propone una lista corta <code>Palette.LOOT</code> de colores claros y saturados y comprobar en Blender que cada <code>color_oscuro_N</code> no cae en el morado del fondo. Hoy, de los ${D.loot_count} colores de pieza de la historia, ${D.loot_low.length} quedan por debajo de 4,5:1 como texto sobre el cristal${D.loot_low.length ? ": " + D.loot_low.map(h => sw(h) + `<code>${h}</code>`).join(", ") : ""}. Algunas piezas se parecen a un ladrón; por eso, en el plano y la leyenda la pieza iría con una marca fija, el rombo Oro con borde Lila.</li>
      <li><b>El mapa del plan.</b> Es papel pergamino (<code>MapStage</code>, <code>Hud.MAP_FLOOR</code>) y ahí los colores de juego claros no se ven: el Turquesa da 1,1:1 y la Alarma 2,3:1. Sobre el papel hay que usar los tonos oscuros (Alarma oscura 6,6:1, Cielo oscuro 6,0:1, Orquídea oscura 7,1:1). En tritanopia, Turquesa oscuro y Menta oscura se parecen (ΔE 2,3): en el papel, la salida debería ir con su icono. La otra salida es un «papel de noche» (Berenjena con líneas Lila).</li>
      <li><b>La iluminación cambia el color.</b> Los tonos del museo se ven a través de la luz ambiente (<code>#6256aa</code>), la luna y los apliques cálidos: un suelo ocre puede acabar gris. Hay que ajustar la regla de museo mirando capturas, no solo los colores.</li>
      <li><b>Ladrón 3 deja de ser violeta y el 2 cambia de naranja.</b> Es lo más visible para quien ya juega: van en los menús de jugadores, en las cajas de minijuego, en los avisos y en los «fantasmas».</li></ul>

    <h2 id="propuesta-dudas">Dudas para decidir</h2>
    <ul><li>¿Botones de menú en Lila sobre cristal, o seguir con el botón de juguete crema y tinta (que pasaría a Pergamino con Noche)?</li>
      <li>¿Aceptas que el ladrón 3 pase de violeta a Orquídea, y el 2 a una Mandarina más roja, o preferís otros tonos?</li>
      <li>El segundo aviso de sospecha («!!») usa Mandarina, el color del ladrón 2. ¿Se queda así, porque va sobre la cabeza del guardia y con sus signos, o pasa a un tono entre Oro y Alarma?</li>
      <li>El mapa del plan, ¿en pergamino con tonos oscuros, o en papel de noche morado?</li>
      <li>¿A salvo y Salida en un solo color (Menta)? Hoy son cian y verde.</li>
      <li>Los cuadros, el mando y la recreativa quedan fuera de la paleta, como ilustración. ¿De acuerdo, o también se «pasan por la noche»?</li></ul>`;
}

// --- Versiones: hitos de las imágenes importantes (docs/versiones/) -------------------------
const V = window.VERSIONES || { asuntos: [], versiones: [] };
const ELEGIDAS = {};
const kb = b => b >= 1048576 ? (b / 1048576).toFixed(1).replace(".", ",") + " MB" : Math.round(b / 1024) + " KB";
const fechaV = f => { const [d, h] = f.split("T"); const [a, m, dd] = d.split("-"); return `${dd}-${m}-${a}${h ? " " + h : ""}`; };
function versiones() {
  const porAsunto = a => V.versiones.filter(v => v.asunto === a.id);
  $("#p-versiones").innerHTML = `<h1>Versiones</h1>
    <div class="sub">Cómo estaba y cómo está: hitos de las imágenes importantes, guardados en <code>docs/versiones/</code> · ${V.versiones.length} imágenes, ${kb(V.bytes || 0)}</div>
    <p class="lead">No son todas las versiones: solo los hitos, los cambios muy visibles, o una versión muy antigua cuando algo ha cambiado poco a poco y ya se parece poco al principio. Elige dos para compararlas, lado a lado o con la cortina.</p>
    <div class="indice"><ul>${V.asuntos.map(a => `<li><a href="#versiones/${a.id}">${esc(a.title)}</a> <span class="estado">· ${porAsunto(a).length}</span></li>`).join("")}<li><a href="#versiones/como">Cómo y cuándo guardar un hito</a></li></ul></div>
    ${V.asuntos.map(a => `<section class="asunto" id="versiones-${a.id}"><h2 style="border:0;margin-top:0">${esc(a.title)}</h2>${a.text ? `<p>${esc(a.text)}</p>` : ""}
      <div class="comparar" data-asunto="${a.id}"></div>
      <div class="linea">${porAsunto(a).map((v, i) => `<div class="hito" data-v="${esc(v.file)}"><img loading="lazy" src="${v.file}" alt="" data-img="${v.file}" data-cap="${esc(v.titulo)} · ${fechaV(v.fecha)}">
        <div class="f">${fechaV(v.fecha)} · <code>${esc(v.commit)}</code></div><div class="t">${i + 1}. ${esc(v.titulo)}</div>
        ${v.cambio ? `<p>${esc(v.cambio)}</p>` : ""}${v.porque ? `<p class="estado">Por qué: ${esc(v.porque)}</p>` : ""}
        <div class="estado">${v.size ? v.size.join("×") + " · " : ""}${kb(v.bytes || 0)}</div>
        <div class="bs"><button class="btn" data-poner="${a.id}|0|${esc(v.file)}">antes</button><button class="btn" data-poner="${a.id}|1|${esc(v.file)}">después</button></div></div>`).join("")}</div></section>`).join("")}
    <h2 id="versiones-como">Cómo y cuándo guardar un hito</h2>
    <p><b>Cuándo:</b> cuando una imagen importante (el fondo de los menús, los menús, el icono, una pieza que se ve mucho, el mapa de la historia…) cambia de verdad: otro estilo, otro modelo, otra idea. No por cada retoque. Si algo va cambiando poco a poco, se guarda de vez en cuando la versión de antes, cuando ya se parezca poco a la del principio. Mejor el mismo encuadre en todas las de un asunto (la misma captura), para poder compararlas.</p>
    <p><b>Cómo:</b> con <code>tools/docs.py version</code>, que convierte la imagen a webp (1280 px como mucho) y la apunta en <code>docs/versiones/versiones.json</code> con su fecha, su commit, el título, por qué se guarda y qué cambió:</p>
    <pre class="mono">python3 tools/docs.py version fondo-menus "La sala del museo" --why "Cambia el fondo" --what "…"
python3 tools/docs.py version menus "Cristal ahumado" --from menu_titulo          # una captura de docs/capturas
python3 tools/docs.py version icono "Pixel art" --from assets/icon.png --commit ed1b2ac   # sacada de un commit
python3 tools/docs.py version recreativa "Seis juegos" --from a.webp --from b.webp  # varias, en rejilla
python3 tools/docs.py version --list</pre>
    <p class="estado">Sin <code>--from</code>, la imagen de siempre del asunto (en el manifiesto, <code>source</code>). Con <code>--commit</code>, se saca con <code>git show &lt;commit&gt;:&lt;ruta&gt;</code> y toma la fecha del commit. El texto de cada asunto y cualquier hito se pueden corregir a mano en el manifiesto; <code>build</code> lo copia a <code>docs/data/versiones.js</code>. Nada guarda versiones solo.</p>`;
  for (const a of V.asuntos) {
    const lista = porAsunto(a);
    if (!ELEGIDAS[a.id]) ELEGIDAS[a.id] = { antes: (lista[0] || {}).file, despues: (lista[lista.length - 1] || {}).file, modo: "cortina" };
    comparar(a.id);
  }
}
function comparar(id) {
  const el = document.querySelector(`.comparar[data-asunto="${id}"]`);
  if (!el) return;
  const lista = V.versiones.filter(v => v.asunto === id), e = ELEGIDAS[id];
  const va = lista.find(v => v.file === e.antes), vd = lista.find(v => v.file === e.despues);
  document.querySelectorAll(`#versiones-${id} .hito`).forEach(h => h.classList.toggle("sel", h.dataset.v === e.antes || h.dataset.v === e.despues));
  if (lista.length < 2 || !va || !vd) { el.innerHTML = lista.length === 1 ? `<p class="estado">Solo hay un hito: cuando cambie mucho, se guarda el siguiente.</p>` : ""; return; }
  const opciones = sel => lista.map((v, i) => `<option value="${esc(v.file)}" ${v.file === sel ? "selected" : ""}>${i + 1}. ${esc(v.titulo)} (${fechaV(v.fecha).slice(0, 10)})</option>`).join("");
  const [w, h] = vd.size || [16, 9];
  el.innerHTML = `<div class="mandos"><label>Antes <select data-cmp="${id}|antes">${opciones(e.antes)}</select></label><label>Después <select data-cmp="${id}|despues">${opciones(e.despues)}</select></label>
    <span><button class="btn ${e.modo === "cortina" ? "si" : ""}" data-modo="${id}|cortina">Cortina</button> <button class="btn ${e.modo === "lado" ? "si" : ""}" data-modo="${id}|lado">Lado a lado</button></span></div>
    ${e.modo === "lado" ? `<div class="lado"><figure><img src="${va.file}" alt="" data-img="${va.file}" data-cap="${esc(va.titulo)}"><figcaption><b>Antes</b> · ${esc(va.titulo)}</figcaption></figure><figure><img src="${vd.file}" alt="" data-img="${vd.file}" data-cap="${esc(vd.titulo)}"><figcaption><b>Después</b> · ${esc(vd.titulo)}</figcaption></figure></div>`
      : `<div class="cortina" style="aspect-ratio:${w} / ${h};max-width:${Math.min(960, w * 1.5)}px"><img src="${vd.file}" alt=""><div class="antes" style="clip-path:inset(0 50% 0 0)"><img src="${va.file}" alt=""></div><div class="raya" style="left:50%"></div>
        <span class="rot" style="left:6px">Antes · ${esc(va.titulo)}</span><span class="rot" style="right:6px">Después · ${esc(vd.titulo)}</span>
        <input type="range" min="0" max="100" value="50" aria-label="Cortina entre antes y después" data-cortina></div>`}`;
}
document.addEventListener("input", e => {
  const r = e.target.closest("[data-cortina]");
  if (!r) return;
  const c = r.closest(".cortina"), v = r.value;
  c.querySelector(".antes").style.clipPath = `inset(0 ${100 - v}% 0 0)`;
  c.querySelector(".raya").style.left = v + "%";
});
document.addEventListener("change", e => {
  const s = e.target.closest("[data-cmp]");
  if (!s) return;
  const [id, cual] = s.dataset.cmp.split("|");
  ELEGIDAS[id][cual] = s.value;
  comparar(id);
});
document.addEventListener("click", e => {
  const m = e.target.closest("[data-modo]");
  if (m) { const [id, modo] = m.dataset.modo.split("|"); ELEGIDAS[id].modo = modo; comparar(id); return; }
  const p = e.target.closest("[data-poner]");
  if (p) { const [id, cual, file] = p.dataset.poner.split("|"); ELEGIDAS[id][cual === "0" ? "antes" : "despues"] = file; comparar(id); document.getElementById("versiones-" + id).scrollIntoView({ behavior: "smooth" }); }
});

// --- Clics: copiar, ampliar, editar -------------------------------------------------------
document.addEventListener("click", async e => {
  const copia = e.target.closest("[data-copy]");
  if (copia) { navigator.clipboard?.writeText(copia.dataset.copy); return; }
  const ir = e.target.closest("[data-ir]");
  if (ir) { verOtra(+ir.dataset.ir); return; }
  if (e.target.closest("#caja")) { $("#caja").classList.remove("on"); return; }
  const img = e.target.closest("img[data-img]");
  if (img) { ver(img); return; }
  const el = e.target.closest("[data-key]");
  if (!EDITABLE || !el || el.querySelector("textarea") || e.target.closest(".botones") || e.target.closest("a")) return;
  e.preventDefault();
  const key = el.dataset.key, antes = el.dataset.valor ?? tx(key), html = el.innerHTML, cls = el.className;
  el.className = "";
  el.innerHTML = `<textarea class="editor"></textarea><span class="botones"><button class="btn si">Guardar</button><button class="btn">Cancelar</button><span class="estado">${esc(key)}</span></span>`;
  const ta = el.querySelector("textarea");
  ta.value = antes; ta.style.height = Math.max(64, ta.scrollHeight + 6) + "px"; ta.focus();
  const [ok, no] = el.querySelectorAll("button");
  no.onclick = ev => { ev.stopPropagation(); el.innerHTML = html; el.className = cls; };
  ok.onclick = async ev => {
    ev.stopPropagation();
    ok.disabled = true; ok.textContent = "Guardando…";
    const r = await fetch("api/texto", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ key, es: ta.value }) });
    const res = await r.json().catch(() => ({}));
    if (!r.ok) { ok.disabled = false; ok.textContent = "Guardar"; const a = document.createElement("div"); a.className = "aviso"; a.textContent = res.error || "No se pudo guardar"; el.appendChild(a); return; }
    const src = await (await fetch("data/textos.js?" + Date.now())).text();
    TX = JSON.parse(src.replace(/^window\.TEXTOS = /, "").replace(/;\s*$/, ""));
    indexar(); pintar(); ir();
  };
});
// La caja enseña una captura en grande; las flechas pasan a las demás de la página.
let viendo = null;
function ver(img) {
  viendo = img;
  const c = $("#caja");
  c.querySelector("img").src = img.dataset.img;
  c.querySelector("p").textContent = img.dataset.cap || "";
  c.classList.add("on");
}
function verOtra(d) {
  const todas = [...document.querySelectorAll(".pagina.on img[data-img]")];
  const i = todas.indexOf(viendo);
  if (i >= 0 && todas[i + d]) ver(todas[i + d]);
}
// Sin la caja, las flechas van a la pantalla anterior o siguiente.
document.addEventListener("keydown", e => {
  if (e.target.closest("input, textarea, select")) return;
  const abierta = $("#caja").classList.contains("on");
  if (e.key === "Escape") $("#caja").classList.remove("on");
  else if (abierta && (e.key === "ArrowLeft" || e.key === "ArrowRight")) verOtra(e.key === "ArrowLeft" ? -1 : 1);
  else if (!abierta && location.hash.startsWith("#pantalla/") && (e.key === "ArrowLeft" || e.key === "ArrowRight")) {
    const i = ORDEN.indexOf(paginaDe(decodeURIComponent(location.hash.split("/")[1])));
    const x = ORDEN[i + (e.key === "ArrowLeft" ? -1 : 1)];
    if (x) location.hash = "pantalla/" + x;
  }
});

function pintar() {
  NAV.portada(); inicio(); capturas(); estilo(); paleta(); objetos(); personajes(); sonidos(); historia(); ciudad(); textos(); megafonia(); procedencia(); referencias();
  previa(); minijuegos(); escondites(); coleccion(); propuesta(); versiones();
  document.body.classList.toggle("editable", EDITABLE);
}
pintar();
ir();
// Con el servidor de tools/docs.py, los textos se pueden cambiar.
if (location.protocol.startsWith("http")) {
  fetch("api/ping").then(r => r.ok && r.json()).then(j => { if (j && j.editable) { EDITABLE = true; pintar(); ir(); return fetch("api/alternativas").then(r => r.ok && r.json()).then(el => { if (el) { AL.elegidas = el; pintar(); ir(); } }).then(() => fetch("api/referencias")).then(r => r.ok && r.json()).then(rs => { if (rs) { RF = rs; pintar(); ir(); } }); } }).catch(() => {});
}
</script>
