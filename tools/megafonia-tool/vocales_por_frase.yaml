# Sonidos que lleva cada frase, por id (el de frases.csv, o la clave del juego en minúsculas).
# Así se añaden a las frases del juego sin tocar locale/texts.csv.
#   sonido: inicio | final | N  (N = justo después de la frase N del texto)
# Solo suenan los de vocales.permitidas en config.yaml. Cuándo usar cada uno: ver el README.

# risa: solo remate de las MUY vacilonas (tope: 1 de cada 10 frases del lote)
mega_act_roll_wall_01: {risa: final}      # Hay quien usa la cabeza para hacer agujeros en la pared.
mega_act_knock_bust_03: {risa: final}     # Un busto en el suelo. Era famoso, pero se le pasó.
mega_act_hide_armour_02: {risa: final}    # La armadura respira fuerte. Y huele a calcetín.
mega_act_crash_streak_05: {risa: final}   # A este paso, alguien tendrá la cabeza cuadrada.

# suspiro: el locutor, cansado de lo de siempre
mega_start_05: {suspiro: 1}               # Hoy es martes. (...) Mañana también habrá martes.
mega_act_roll_wall_again_04: {suspiro: 1} # La pared sigue en el mismo sitio. (...) Como siempre.
mega_calm_13: {suspiro: 1}                # El ascensor no sube. (...) Ni siquiera lo intenta.
mega_near_exit_02: {suspiro: 1}           # La salida está aquí mismo. (...) Como siempre.
mega_act_smoke_last_04: {suspiro: final}  # Ya no queda humo. Alguien suspira muy fuerte.

# ejem: arranque formal falso, o para disimular un desliz
mega_start_02: {ejem: inicio}             # Buenas noches. Los cuadros duermen...
mega_act_plinth_03: {ejem: inicio}        # Atención: nueva obra de arte, «Sombra de puntillas».
mega_hide_03: {ejem: 1}                   # ...muy buen escondite. (ejem) Digo, decoración.
mega_lights_on_04: {ejem: 1}              # Luces encendidas. (ejem) Se ruega poner cara de no haber sido nadie.

# tos: después de algo incómodo (o de polvo y humo)
mega_hint_1_04: {tos: final}              # El mamut estornuda cuando le tosen.
mega_act_sneeze_again_05: {tos: 1}        # Se vende polvo a mitad de precio. (tos) Ahí ya tienen.
mega_smoke_01: {tos: final}               # Nube de humo con muy mal olor a fresa.
mega_act_smoke_02: {tos: 1}               # Alguien ha cocinado una nube. (tos) Sin receta.
