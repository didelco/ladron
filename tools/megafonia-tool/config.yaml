# Megafonía de museo: ajustes globales y presets de efectos.
# Cambiar algo de "presets" NO regenera el TTS (la caché va por texto+voz+velocidad+modelo).

paths:
  csv: frases.csv
  cache: cache
  out: out
  samples: samples
  ir: ir
  chime: assets/chime.wav

tts:
  engine: kokoro
  model: mlx-community/Kokoro-82M-bf16
  lang_code: e            # "e" = español en Kokoro (G2P con espeak-ng "es", castellano)
  default_voice: em_santa   # elegida por el usuario
  default_speed: 0.9
  sample_rate: 24000      # salida nativa de Kokoro
  piper_dir: models/piper # plan B: voces "piper:es_ES-davefx-medium" en la columna voz

export:
  sample_rate: 44100
  lufs: -16.0
  ogg_compression: 0.3    # Vorbis: 0 = máxima calidad, 1 = fichero más pequeño
  true_peak_margin_db: 0.5  # el Vorbis sube algo los picos: el techo real es limiter_db - esto
  tail_silence: 1.5
  fade_out: 0.05          # s de fundido al final       # s de silencio al final para no cortar la reverb
  lead_silence: 0.15      # s al inicio

chime:
  gap: 0.5                # s de silencio tras el ding-dong
  notes: [659.25, 523.25] # mi5 - do5
  note_length: 0.9
  volume_db: -3           # sonoridad del ding-dong respecto a la voz (LUFS)

# Respuestas de impulso: python src/descarga_ir.py las baja y deja en ir/<nombre>.wav
ir_prep:
  sample_rate: 44100
  max_seconds: 4.0
  fade_seconds: 0.5

ir_sources:
  hangar_museo:      # OpenAIR, Yorkshire Air Museum (hangar T2), CC BY 4.0
    url: https://webfiles.york.ac.uk/OPENAIR/IRs/air-museum/b-format/AR_bformat_S1R1_1.wav
    channel: 0       # W (omni) del B-format
  central_hall:      # OpenAIR, Central Hall (University of York), CC BY 4.0
    url: https://webfiles.york.ac.uk/OPENAIR/IRs/central-hall-university-york/b-format/ir_centre_stalls.wav
    channel: 0
  vestibulo:         # EchoThief, Littlefield Lobby (vestíbulo grande)
    url: https://www.echothief.com/wp-content/uploads/2024/07/EchoThiefImpulseResponseLibrary.zip
    member: EchoThiefImpulseResponseLibrary/Miscellaneous/LittlefieldLobby.wav
  pabellon:          # EchoThief, Pabellón Cultural de la República (sala de exposiciones)
    url: https://www.echothief.com/wp-content/uploads/2024/07/EchoThiefImpulseResponseLibrary.zip
    member: EchoThiefImpulseResponseLibrary/Miscellaneous/PabellonCulturalDeLaRepublica.wav
  pasillo:           # EchoThief, Graffiti Hallway (pasillo de hormigón)
    url: https://www.echothief.com/wp-content/uploads/2024/07/EchoThiefImpulseResponseLibrary.zip
    member: EchoThiefImpulseResponseLibrary/Brutalism/GraffitiHallway.wav

# Sonidos entre la locución: [carraspeo], [tos], [risa], [suspiro], [ejem] dentro del texto.
# Pasan por la misma cadena que la voz. modo: "muestra" (un wav de assets/vocales) o "tts"
# (lo dice la propia voz con el texto de "tts"). Se puede forzar por etiqueta: [risa:tts], [risa:muestra].
# Solo suenan si activas y están en "permitidas"; el resto de etiquetas se quitan del texto sin sonar.
# Qué frases llevan sonido: vocales_por_frase.yaml (por id, sin tocar locale/texts.csv).
vocales:
  activas: true
  permitidas: [risa, suspiro, ejem, tos]   # carraspeo: sin aprobar
  modo: muestra
  por_frase: vocales_por_frase.yaml
  max_por_lote: {risa: 0.10}   # aviso si la risa sale en más del 10 % de las frases de un lote
  pausa_antes: 0.20       # s de silencio antes del sonido
  pausa_despues: 0.30     # s después
  tipos:
    carraspeo: {muestra: assets/vocales/carraspeo.wav, tts: "Ejem, ejem.", gain_db: -3}
    tos:       {muestra: assets/vocales/tos.wav,       tts: "Cof, cof.",   gain_db: -3}
    risa:      {muestra: assets/vocales/risa.wav,      tts: "Je, je, je.", gain_db: -4}
    suspiro:   {muestra: assets/vocales/suspiro.wav,   tts: "Ay...",       gain_db: -2}
    ejem:      {muestra: assets/vocales/ejem.wav,      tts: "Ejem.",       gain_db: -3}

# De dónde salen las muestras de assets/vocales (python src/prepara_vocales.py). Licencias en
# assets/LICENCIAS_vocales.md. Recorte en segundos del fichero original.
vocales_fuentes:
  carraspeo: {url: "https://upload.wikimedia.org/wikipedia/commons/e/ef/Laughter_and_clearing_voice.ogg", ini: 5.15, fin: 6.80}
  ejem:      {url: "https://upload.wikimedia.org/wikipedia/commons/e/ef/Laughter_and_clearing_voice.ogg", ini: 6.15, fin: 6.80}
  risa:
    url: "https://upload.wikimedia.org/wikipedia/commons/e/ef/Laughter_and_clearing_voice.ogg"
    ini: 0.30             # solo la tanda descendente «ja-ja-ja», sin el golpe final
    fin: 1.85
    original: {ini: 0.10, fin: 2.60}   # el recorte anterior, se guarda como risa_original.wav
    limpieza:
      highpass_hz: 200    # fuera el barro grave
      highpass_etapas: 2
      peaks: [[400, -4.0, 1.0], [2500, 2.0, 1.0]]   # [Hz, dB, Q]: menos caja, algo más de presencia
      deesser: {hz: 6000, gain_db: -4.0}
      gate: {umbral_rel_db: -38, ratio: 4, attack_ms: 1, release_ms: 80}
  tos:       {url: "https://upload.wikimedia.org/wikipedia/commons/d/d9/Cough_2.ogg", ini: 2.40, fin: 3.60}
  suspiro:   {url: "https://upload.wikimedia.org/wikipedia/commons/9/95/Four_sighs.ogg", ini: 1.10, fin: 2.10}

# Frases del juego (--desde-juego): claves MEGA_*_NN de locale/texts.csv
juego:
  csv: ../../locale/texts.csv   # relativo a esta carpeta
  columna: es
  preset: sala
  presets:                      # por prefijo de clave
    MEGA_ALARM_: alarma
  chime: false                  # los avisos del juego son cortos y frecuentes
  tail_silence: 0.9             # cola más corta que la de export (1.5 s)
  megaphone_gd: ../../logic/megaphone.gd   # sus POOLS dicen qué claves usa el juego
  relleno_pieza: null           # frases con %s (nombre de la pieza): null = se saltan

# Integración con Godot (--godot-dir): destino dentro del proyecto y rutas res:// del índice
godot:
  res_dir: audio/megafonia

presets:
  sala:
    filter_stages: 2        # filtros apilados (cada uno 6 dB/oct)
    level_db: -6            # pico de trabajo entre etapas (el drive y el ruido van referidos a él)
    highpass_hz: 400
    lowpass_hz: 3500
    peak: {freq_hz: 1800, gain_db: 4.0, q: 1.0}
    compressor: {threshold_db: -24, ratio: 6, attack_ms: 3, release_ms: 90}
    drive_db: 5.0
    delay: {seconds: 0.15, feedback: 0.12, mix: 0.15}
    reverb: {ir: hangar_museo, wet: 0.30}   # IR elegida por el usuario
    noise: {hiss_db: -66, hiss_band_hz: [1500, 6000], hum_db: -70, hum_hz: 50}
    limiter_db: -1.0

  pasillo:
    filter_stages: 2        # filtros apilados (cada uno 6 dB/oct)
    level_db: -6            # pico de trabajo entre etapas (el drive y el ruido van referidos a él)
    highpass_hz: 350
    lowpass_hz: 4000
    peak: {freq_hz: 1800, gain_db: 3.0, q: 1.0}
    compressor: {threshold_db: -24, ratio: 5, attack_ms: 3, release_ms: 90}
    drive_db: 4.0
    delay: {seconds: 0.07, feedback: 0.08, mix: 0.10}
    reverb: {ir: pasillo, wet: 0.15}
    noise: {hiss_db: -64, hiss_band_hz: [1500, 6000], hum_db: -68, hum_hz: 50}
    limiter_db: -1.0

  alarma:
    chime: false
    filter_stages: 2        # filtros apilados (cada uno 6 dB/oct)
    level_db: -6            # pico de trabajo entre etapas (el drive y el ruido van referidos a él)
    highpass_hz: 500
    lowpass_hz: 3000
    peak: {freq_hz: 1800, gain_db: 5.0, q: 1.2}
    compressor: {threshold_db: -26, ratio: 8, attack_ms: 2, release_ms: 70}
    drive_db: 10.0
    delay: {seconds: 0.14, feedback: 0.15, mix: 0.15}
    reverb: {ir: hangar_museo, wet: 0.25}
    noise: {hiss_db: -60, hiss_band_hz: [1500, 6000], hum_db: -64, hum_hz: 50}
    limiter_db: -1.0
