name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7
    env:
      GODOT: godot
    steps:
      - uses: actions/checkout@v4

      - name: Caché de .godot
        uses: actions/cache@v4
        with:
          path: .godot
          key: godot-import-${{ hashFiles('project.godot', '**/*.import') }}
          restore-keys: godot-import-

      - name: Importar el proyecto
        run: godot --headless --import || true

      - name: Tests
        run: tests/run_all.sh
        env:
          LOGDIR: ${{ runner.temp }}/tests-logs

      - name: Logs de los tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tests-logs
          path: ${{ runner.temp }}/tests-logs
